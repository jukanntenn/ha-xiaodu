name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    name: prek run --all-files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          enable-cache: "true"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --group dev
      - name: Validate prek config
        run: uvx prek validate-config prek.toml
      # 单一真相源：CI 的全部 format/lint 门控都在 prek.toml 中定义（ruff、codespell、
      # basedpyright lock、import-linter、deptry、hassfest、workflow 校验等），
      # 这里只负责装好环境后调 prek，与本地 `prek run --all-files` 完全一致。
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true
      - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43 # v1.1.0
        if: always()
        with:
          msg: "style: apply prek auto-fixes"
