name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "uv.lock"
      - "pyproject.toml"
  pull_request:
    paths:
      - "**.py"
      - "uv.lock"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ha-target: stable-prev, phacc-pin: "==0.13.316" }
          - { ha-target: latest, phacc-pin: "" }
    name: pytest (ha-target=${{ matrix.ha-target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install 3.13
      - run: uv sync --group dev
      - run: uv pip install "pytest-homeassistant-custom-component${{ matrix.phacc-pin }}"
      # 测试命令的真相源在 prek.toml（check 组 pytest 钩子），与本地 pre-push /
      # `prek run --group check --all-files` 完全一致；矩阵只差 phacc pin 的安装。
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true
          install-only: true
      - name: Run tests (prek check group)
        run: prek run --group check --all-files
      - name: Upload coverage
        if: matrix.ha-target == 'latest'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
