name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_zip_file:
    if: startsWith(github.event.release.tag_name, 'v')
    name: Prepare release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set manifest version
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${{ steps.version.outputs.VERSION }}\"/" custom_components/xiaodu/manifest.json

      - name: Create zip
        run: |
          cd custom_components/xiaodu
          zip xiaodu.zip -r ./

      - name: Upload zip to release
        run: gh release upload "${GITHUB_REF_NAME}" ./custom_components/xiaodu/xiaodu.zip#xiaodu.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
