name: 功能建议
description: 提出具体的功能或行为改进——未成型的想法请先到 Discussions 想法区讨论
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        描述你**想要的结果**，「怎么做」留给后续讨论。
        还在酝酿中的想法欢迎先到 [Discussions 想法区](https://github.com/jukanntenn/ha-xiaodu/discussions)聊聊，形成共识后再回来提具体建议。

  - type: checkboxes
    id: existing
    attributes:
      label: 事前检查
      options:
        - label: 我已搜索过既有 issue 与 Discussions，没有相同的建议
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 想要实现什么
      description: 一句话概括。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在做不到什么 / 哪里不好用？谁会受益？
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: 期望的行为
      description: 概要描述期望的可感知变化，不必写实现方案。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: terms
    attributes:
      label: 行为准则
      options:
        - label: 我同意遵守本项目的[行为准则](https://github.com/jukanntenn/ha-xiaodu/blob/main/.github/CODE_OF_CONDUCT.md)
    validations:
      required: true
