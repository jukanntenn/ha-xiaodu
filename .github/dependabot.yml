version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # pytest-aiohttp >= 1.1.1 要求 Python >= 3.14.2，与项目 requires-python >= 3.13 冲突
      - dependency-name: "pytest-aiohttp"
        versions: [">=1.1.1"]
      # pytest-homeassistant-custom-component 当前约束 pytest-timeout<=2.3.1，2.4.0 无法解析
      - dependency-name: "pytest-timeout"
        versions: [">=2.4.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
